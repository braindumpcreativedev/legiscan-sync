name: LegiScan sync

on:
schedule:
  - cron: "15 10 * * *" # daily, ~5:15 AM Eastern
workflow_dispatch: {}

jobs:
sync:
  runs-on: ubuntu-latest
  timeout-minutes: 120
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    # Remembers which bill texts and roll calls were already sent, so they are never downloaded twice.
    - uses: actions/cache@v4
      with:
        path: .legiscan-state.json
        key: legiscan-state-${{ github.run_id }}
        restore-keys: legiscan-state-
    - run: node sync/legiscan-sync.mjs
      env:
        LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        NFRMD_API: ${{ vars.NFRMD_API }}
        STATES: ${{ vars.STATES }}
        MAX_BILLS_PER_RUN: "400"
